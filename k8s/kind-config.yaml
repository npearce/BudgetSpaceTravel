kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bst-demo

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

# BOOTSTRAP STEP (required — Kind doesn't support external networks in YAML):
# After creating the cluster, connect it to bst-external so AgentGateway can
# reach nasa and spacex by service name:
#   docker network connect bst-external bst-demo-control-plane
#
# This is a one-time operation after cluster creation. The bst-external network
# is created by docker-compose.yaml and persists across Kind cluster restarts.
